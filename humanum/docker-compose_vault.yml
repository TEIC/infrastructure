name: teivault

services:
  vault:
    image: nginx:alpine
    container_name: vault
    volumes:
      - /data/Vault:/usr/share/nginx/html:ro
      - ./vault.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - VIRTUAL_HOST=vault.tei-c.org
      - LETSENCRYPT_HOST=vault.tei-c.org
      - VIRTUAL_PORT=80
      - LETSENCRYPT_EMAIL=stadler@edirom.de
    restart: unless-stopped
    networks:
      - tei_net

networks:
  tei_net:
    external: true
